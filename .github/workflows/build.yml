name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/l200dash.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/l200dash.jks" >> "$GITHUB_ENV"
            echo "Llave de firma cargada."
          else
            echo "::warning::No hay secreto KEYSTORE_BASE64: se firmará con una llave temporal."
          fi

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk L200Dash.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: L200Dash-apk
          path: L200Dash.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dash-build-${{ github.run_number }}
          name: L200 Dash build ${{ github.run_number }}
          files: L200Dash.apk
